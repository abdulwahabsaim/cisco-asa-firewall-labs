<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B13" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080E1A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Tech Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Corner Glowing Accents -->
  <path d="M 30 90 L 30 30 L 90 30" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 1110 30 L 1170 30 L 1170 90" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 30 540 L 30 600 L 90 600" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 1110 600 L 1170 600 L 1170 540" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Top System Tag -->
  <g transform="translate(600, 110)">
    <rect x="-240" y="-18" width="480" height="36" rx="6" fill="#0F172A" stroke="#0EA5E9" stroke-width="1" opacity="0.9" />
    <text text-anchor="middle" y="6" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3">[ SEC-NOC // ENTERPRISE FIREWALL LABS ]</text>
  </g>

  <!-- Main Repository Title -->
  <text text-anchor="middle" x="600" y="225" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">Cisco ASA &amp; Network Security Labs</text>

  <!-- Subtitle -->
  <text text-anchor="middle" x="600" y="278" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">ASA 5520 • Security Zones (0-100) • Stateful Inspection • MPF • NAT/PAT • Dynamic Routing</text>

  <!-- Middle Protocol Badge Pills -->
  <g transform="translate(600, 370)">
    <!-- Badge 1: Stateful Inspection -->
    <g transform="translate(-380, -22)">
      <rect width="170" height="44" rx="8" fill="#0369A1" fill-opacity="0.15" stroke="#0284C7" stroke-width="1.5" />
      <text text-anchor="middle" x="85" y="27" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">STATEFUL INSPECTION</text>
    </g>
    <!-- Badge 2: Security Levels -->
    <g transform="translate(-190, -22)">
      <rect width="170" height="44" rx="8" fill="#1E3A8A" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.5" />
      <text text-anchor="middle" x="85" y="27" fill="#60A5FA" font-family="monospace" font-size="13" font-weight="bold">SECURITY ZONES</text>
    </g>
    <!-- Badge 3: MPF & ACLs -->
    <g transform="translate(0, -22)">
      <rect width="170" height="44" rx="8" fill="#064E3B" fill-opacity="0.25" stroke="#10B981" stroke-width="1.5" />
      <text text-anchor="middle" x="85" y="27" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">MPF &amp; EXTENDED ACL</text>
    </g>
    <!-- Badge 4: EVE-NG Labs -->
    <g transform="translate(190, -22)">
      <rect width="190" height="44" rx="8" fill="#4C1D95" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1.5" />
      <text text-anchor="middle" x="95" y="27" fill="#A78BFA" font-family="monospace" font-size="13" font-weight="bold">EVE-NG EMULATION</text>
    </g>
  </g>

  <!-- Lower Architecture Indicator -->
  <text text-anchor="middle" x="600" y="460" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">Un-NAT &#8594; ACL Validation &#8594; Route Lookup &#8594; Source NAT &#8594; L4 State Inspection</text>

  <!-- Footer Divider Line -->
  <line x1="200" y1="510" x2="1000" y2="510" stroke="#1E293B" stroke-width="1" />

  <!-- Footer Identity -->
  <text text-anchor="middle" x="600" y="545" fill="#64748B" font-family="monospace" font-size="13" font-weight="600" letter-spacing="2.5">ABDUL WAHAB SAIM • CCNA 200-301 • VERIFIED ENTERPRISE LABS</text>
</svg>